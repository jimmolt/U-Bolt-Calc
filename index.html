<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>U-Bolt Blank Size Calculator</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'%3E%3Crect width='400' height='400' fill='%23f4f1ea'/%3E%3Cpath d='M120,50 L120,220 Q120,250 150,250 L250,250 Q280,250 280,220 L280,50' fill='none' stroke='%233a3530' stroke-width='26' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #1b1f27;
    --paper: #efece3;
    --card: #fffefb;
    --line: #ddd7c7;
    --accent: #d98e2b;
    --accent-deep: #a8691a;
    --readout-bg: #171b21;
    --readout-text: #ffa733;
    --muted: #6b7280;
    --danger: #b8402c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, Helvetica, sans-serif;
    background-color: var(--paper);
    background-image:
      radial-gradient(circle, rgba(27,31,39,0.07) 1px, transparent 1px);
    background-size: 22px 22px;
    margin: 0;
    padding: 32px 20px;
    color: var(--ink);
  }
  .container {
    max-width: 920px;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 1px 2px rgba(27,31,39,0.04), 0 12px 32px -12px rgba(27,31,39,0.18);
    overflow: hidden;
  }
  .app-header {
    background: var(--ink);
    color: #f4f1e9;
    padding: 22px 32px 20px;
    border-bottom: 3px solid var(--accent);
    position: relative;
  }
  .app-header .eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }
  h1 {
    font-size: 23px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .subtitle {
    color: #b9b3a3;
    font-size: 13px;
    margin-top: 4px;
  }
  .body-pad { padding: 26px 32px 32px; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 18px 22px;
    align-items: flex-end;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .field label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  .field select, .field input {
    padding: 9px 11px;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    border: 1px solid #c9c2ae;
    background: #fffefc;
    border-radius: 5px;
    width: 150px;
    color: var(--ink);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .field select:focus, .field input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(217,142,43,0.18);
  }
  .field input#partNumber { width: 200px; }
  button#printBtn {
    padding: 11px 24px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    height: 40px;
    transition: background .15s ease, transform .05s ease;
  }
  button#printBtn:hover { background: var(--accent-deep); }
  button#printBtn:active { transform: translateY(1px); }

  .result-banner {
    display: flex;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--ink);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 26px;
    flex-wrap: wrap;
  }
  .result-item {
    flex: 1 1 140px;
    background: var(--readout-bg);
    padding: 14px 18px 12px;
  }
  .result-item.primary { background: #12151a; }
  .result-item .val {
    font-family: "SF Mono", "Courier New", Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 20px;
    font-weight: 700;
    color: var(--readout-text);
    letter-spacing: 0.01em;
  }
  .result-item.primary .val { font-size: 24px; color: #ffb14d; }
  .result-item .lbl {
    font-size: 10px;
    text-transform: uppercase;
    color: #c7cbd4;
    letter-spacing: 0.08em;
    margin-top: 3px;
    font-weight: 600;
  }

  .drawing-wrap {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px;
    background-color: #fbfaf6;
    background-image:
      linear-gradient(rgba(27,31,39,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(27,31,39,0.05) 1px, transparent 1px);
    background-size: 24px 24px;
    position: relative;
  }
  svg { width: 100%; height: auto; display: block; }

  .titleblock {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    margin-top: 16px;
    border: 1.5px solid var(--ink);
    border-radius: 6px;
    overflow: hidden;
    font-size: 12px;
  }
  .titleblock div {
    padding: 8px 12px;
    border-right: 1px solid #cfc9b8;
    border-bottom: 1px solid #cfc9b8;
    background: #fffefc;
  }
  .titleblock div:nth-child(4n) { border-right: none; }
  .titleblock .tb-label {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    display: block;
  }
  .titleblock .tb-val {
    font-weight: 700;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }

  @media print {
    body { background: #fff; padding: 0; }
    .container { border: none; box-shadow: none; border-radius: 0; }
    .app-header, .controls, button#printBtn { display: none; }
    .body-pad { padding: 0; }
    .drawing-wrap { border: none; padding: 0; background-image: none; background-color: #fff; }
    .result-banner { border-color: #333; }
    .result-item, .result-item.primary { background: #fff; }
    .result-item .val, .result-item.primary .val { color: var(--ink); }
    .result-item .lbl { color: #555; }
  }

  @media (max-width: 640px) {
    body { padding: 12px; }
    .app-header { padding: 18px 18px 16px; }
    .body-pad { padding: 18px 16px 24px; }
    h1 { font-size: 19px; }
    .controls { flex-direction: column; align-items: stretch; gap: 14px; }
    .field { width: 100%; }
    .field select, .field input, .field input#partNumber { width: 100%; font-size: 16px; padding: 12px 10px; }
    button#printBtn { width: 100%; height: 48px; font-size: 15px; }
    .result-item { flex: 1 1 45%; }
    .result-item.primary { flex-basis: 100%; }
    .titleblock { grid-template-columns: repeat(2, 1fr); font-size: 11px; }
    .titleblock div:nth-child(4n) { border-right: 1px solid #cfc9b8; }
    .titleblock div:nth-child(2n) { border-right: none; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="app-header">
    <div class="eyebrow">Shop Drawing &middot; Fabrication Reference</div>
    <h1>Square U-Bolt Blank Size Calculator</h1>
    <div class="subtitle">Blank length, thread callout, and a print-ready bend drawing</div>
  </div>
  <div class="body-pad">

  <div class="controls">
    <div class="field">
      <label for="diameter">Diameter</label>
      <select id="diameter">
        <option value="0.25">1/4 (.250)</option>
        <option value="0.3125">5/16 (.3125)</option>
        <option value="0.375">3/8 (.375)</option>
        <option value="0.4375">7/16 (.4375)</option>
        <option value="0.5" selected>1/2 (.500)</option>
        <option value="0.5625">9/16 (.5625)</option>
        <option value="0.625">5/8 (.625)</option>
        <option value="0.75">3/4 (.750)</option>
        <option value="0.875">7/8 (.875)</option>
        <option value="1">1 (1.000)</option>
      </select>
    </div>
    <div class="field">
      <label for="dimA">A dimension (spacing)</label>
      <input type="number" id="dimA" value="4.000" step="0.001" data-default="4.000">
    </div>
    <div class="field">
      <label for="dimB">B dimension (leg length)</label>
      <input type="number" id="dimB" value="6.000" step="0.001" data-default="6.000">
    </div>
    <div class="field">
      <label for="threadDesig">Thread Designation</label>
      <select id="threadDesig">
        <option value="1/4-20 Coarse">1/4-20 Coarse</option>
        <option value="1/4-28 Fine">1/4-28 Fine</option>
        <option value="5/16-18 Coarse">5/16-18 Coarse</option>
        <option value="5/16-24 Fine">5/16-24 Fine</option>
        <option value="3/8-16 Coarse">3/8-16 Coarse</option>
        <option value="3/8-24 Fine">3/8-24 Fine</option>
        <option value="7/16-14 Coarse">7/16-14 Coarse</option>
        <option value="7/16-20 Fine">7/16-20 Fine</option>
        <option value="1/2-13 Coarse" selected>1/2-13 Coarse</option>
        <option value="1/2-20 Fine">1/2-20 Fine</option>
        <option value="9/16-12 Coarse">9/16-12 Coarse</option>
        <option value="9/16-18 Fine">9/16-18 Fine</option>
        <option value="5/8-11 Coarse">5/8-11 Coarse</option>
        <option value="5/8-18 Fine">5/8-18 Fine</option>
        <option value="3/4-10 Coarse">3/4-10 Coarse</option>
        <option value="3/4-16 Fine">3/4-16 Fine</option>
        <option value="7/8-9 Coarse">7/8-9 Coarse</option>
        <option value="7/8-14 Fine">7/8-14 Fine</option>
        <option value="1-8 Coarse">1-8 Coarse</option>
        <option value="1-14 Fine">1-14 Fine</option>
      </select>
    </div>
    <div class="field">
      <label for="threadLength">Thread Length</label>
      <input type="number" id="threadLength" value="2.000" step="0.001" data-default="2.000">
    </div>
    <div class="field">
      <label for="partNumber">Customer</label>
      <input type="text" id="partNumber" value="">
    </div>
    <div class="field">
      <label for="quantity">Quantity</label>
      <input type="number" id="quantity" value="1" min="1" step="1" style="width: 100px;">
    </div>
    <button id="printBtn" onclick="window.print()">Print Drawing</button>
  </div>

  <div class="result-banner">
    <div class="result-item primary">
      <div class="val" id="outBlank">--</div>
      <div class="lbl">Blank Size</div>
    </div>
    <div class="result-item">
      <div class="val" id="outDia">--</div>
      <div class="lbl">Diameter</div>
    </div>
    <div class="result-item">
      <div class="val" id="outA">--</div>
      <div class="lbl">A Dimension</div>
    </div>
    <div class="result-item">
      <div class="val" id="outB">--</div>
      <div class="lbl">B Dimension</div>
    </div>
  </div>

  <div class="drawing-wrap">
    <svg id="dwg" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="titleblock">
    <div><span class="tb-label">Customer</span><span class="tb-val" id="tbPart">--</span></div>
    <div><span class="tb-label">Quantity</span><span class="tb-val" id="tbQty">--</span></div>
    <div><span class="tb-label">Material Diameter</span><span class="tb-val" id="tbDia">--</span></div>
    <div><span class="tb-label">Blank (Cut) Length</span><span class="tb-val" id="tbBlank">--</span></div>
    <div><span class="tb-label">Thread Designation</span><span class="tb-val" id="tbThread">--</span></div>
    <div><span class="tb-label">Thread Length</span><span class="tb-val" id="tbThreadLen">--</span></div>
    <div><span class="tb-label">Date</span><span class="tb-val" id="tbDate">--</span></div>
  </div>
  </div>
</div>

<script>
function fmt(n){
  if (isNaN(n)) return "--";
  return (Math.round(n*10000)/10000).toString().replace(/(\.\d*?)0+$/,'$1').replace(/\.$/,'');
}

function toFraction(n, denom){
  denom = denom || 16;
  if (isNaN(n)) return "--";
  const whole = Math.floor(n);
  let frac = n - whole;
  let num = Math.round(frac * denom);
  let d = denom;
  if (num === 0) return whole.toString();
  if (num === d) return (whole+1).toString();
  while (num % 2 === 0 && d % 2 === 0){ num/=2; d/=2; }
  return (whole > 0 ? whole + " " : "") + num + "/" + d;
}

function fmtFull(n, denom){
  if (isNaN(n)) return "--";
  return toFraction(n, denom) + '"';
}

function draw(){
  const d = parseFloat(document.getElementById('diameter').value);
  const A = parseFloat(document.getElementById('dimA').value) || 0;
  const B = parseFloat(document.getElementById('dimB').value) || 0;
  const part = document.getElementById('partNumber').value || '--';
  const qty = document.getElementById('quantity').value || '--';
  const thread = document.getElementById('threadDesig').value || '--';
  const threadLen = document.getElementById('threadLength').value;

  const blank = B + B + A + (0.5 * d);

  document.getElementById('outBlank').textContent = toFraction(blank, 64) + '"';
  document.getElementById('outDia').textContent = fmtFull(d, 64);
  document.getElementById('outA').textContent = fmtFull(A, 64);
  document.getElementById('outB').textContent = fmtFull(B, 64);
  document.getElementById('tbPart').textContent = part;
  document.getElementById('tbQty').textContent = qty;
  document.getElementById('tbThread').textContent = thread;
  document.getElementById('tbThreadLen').textContent = threadLen ? toFraction(parseFloat(threadLen),64) + '"' : '--';
  document.getElementById('tbDia').textContent = fmtFull(d, 64) + ' DIA';
  document.getElementById('tbBlank').textContent = toFraction(blank, 64) + '"';
  document.getElementById('tbDate').textContent = new Date().toLocaleDateString();

  // --- Build the U-bolt drawing ---
  // Layout: legs go up from a semicircular bend at bottom.
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById('dwg');
  svg.innerHTML = '';

  const cx = 450;          // center x
  const legTopY = 90;      // top of legs (y, drawing top)
  const strokeW = Math.max(6, Math.min(16, d*20));

  // scale the inside spacing 'A' visually (not to exact real scale, but proportionate)
  const visA = Math.max(80, Math.min(220, A*25));
  const visLegLen = Math.max(140, Math.min(280, B*22));
  const bendY = legTopY + visLegLen;      // y where straight leg ends / 90-deg bend begins
  const cornerR = Math.max(4, strokeW*0.35); // small corner radius, square u-bolt = sharp-ish corners
  const bottomY = bendY;

  const halfA = visA/2;
  const leftX = cx - halfA;
  const rightX = cx + halfA;

  function line(x1,y1,x2,y2,extra){
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#111" stroke-width="${strokeW}" stroke-linecap="butt" ${extra||''}/>`;
  }

  let html = '';

  // legs (straight vertical sections), stopping short of corner to leave room for rounded corner arcs
  html += line(leftX, legTopY, leftX, bendY - cornerR);
  html += line(rightX, legTopY, rightX, bendY - cornerR);
  // bottom straight span (between the two 90-degree corners)
  html += line(leftX + cornerR, bendY, rightX - cornerR, bendY);
  // square corners with a slight bend radius (typical of formed square U-bolts)
  html += `<path d="M ${leftX} ${bendY - cornerR} A ${cornerR} ${cornerR} 0 0 0 ${leftX + cornerR} ${bendY}" fill="none" stroke="#111" stroke-width="${strokeW}" stroke-linecap="round"/>`;
  html += `<path d="M ${rightX - cornerR} ${bendY} A ${cornerR} ${cornerR} 0 0 0 ${rightX} ${bendY - cornerR}" fill="none" stroke="#111" stroke-width="${strokeW}" stroke-linecap="round"/>`;

  // bend point markers (where straight leg meets the corner, i.e. the B dimension endpoint)
  html += `<circle cx="${leftX}" cy="${bendY}" r="4" fill="#c0392b"/>`;
  html += `<circle cx="${rightX}" cy="${bendY}" r="4" fill="#c0392b"/>`;

  // --- Dimension lines ---
  const dimColor = "#a8691a";
  const extLeft = leftX - 40;
  const extRight = rightX + 40;

  // A dimension (spacing between legs), at top
  html += `<line x1="${leftX}" y1="${legTopY-20}" x2="${leftX}" y2="${legTopY-45}" stroke="${dimColor}" stroke-width="1"/>`;
  html += `<line x1="${rightX}" y1="${legTopY-20}" x2="${rightX}" y2="${legTopY-45}" stroke="${dimColor}" stroke-width="1"/>`;
  html += `<line x1="${leftX}" y1="${legTopY-35}" x2="${rightX}" y2="${legTopY-35}" stroke="${dimColor}" stroke-width="1" marker-start="url(#adL)" marker-end="url(#adR)"/>`;
  html += `<text x="${cx}" y="${legTopY-42}" text-anchor="middle" font-size="15" font-weight="bold" fill="${dimColor}">A = ${toFraction(A,64)}"</text>`;

  // B dimension (leg length) on left side, from bend point to top
  html += `<line x1="${extLeft}" y1="${legTopY}" x2="${leftX-15}" y2="${legTopY}" stroke="${dimColor}" stroke-width="1"/>`;
  html += `<line x1="${extLeft}" y1="${bendY}" x2="${leftX-15}" y2="${bendY}" stroke="${dimColor}" stroke-width="1"/>`;
  html += `<line x1="${extLeft}" y1="${legTopY}" x2="${extLeft}" y2="${bendY}" stroke="${dimColor}" stroke-width="1" marker-start="url(#adL)" marker-end="url(#adR)"/>`;
  html += `<text x="${extLeft-8}" y="${(legTopY+bendY)/2}" text-anchor="end" font-size="15" font-weight="bold" fill="${dimColor}">B = ${toFraction(B,64)}"</text>`;

  // right side duplicate B label small note
  html += `<line x1="${extRight}" y1="${legTopY}" x2="${rightX+15}" y2="${legTopY}" stroke="${dimColor}" stroke-width="1"/>`;
  html += `<line x1="${extRight}" y1="${bendY}" x2="${rightX+15}" y2="${bendY}" stroke="${dimColor}" stroke-width="1"/>`;
  html += `<line x1="${extRight}" y1="${legTopY}" x2="${extRight}" y2="${bendY}" stroke="${dimColor}" stroke-width="1" marker-start="url(#adL)" marker-end="url(#adR)"/>`;
  html += `<text x="${extRight+8}" y="${(legTopY+bendY)/2}" text-anchor="start" font-size="15" font-weight="bold" fill="${dimColor}">B = ${toFraction(B,64)}"</text>`;

  html += `<text x="${cx}" y="${bottomY+30}" text-anchor="middle" font-size="11" fill="#666">bend point marked in red at each B dimension end</text>`;

  // diameter callout near bottom
  html += `<text x="${cx}" y="${bottomY+55}" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Material Diameter: ${toFraction(d,64)}"</text>`;

  // blank size summary (no formula shown)
  html += `<text x="${cx}" y="${bottomY+80}" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">Blank Size: ${toFraction(blank,64)}"</text>`;

  // thread callout
  if (thread !== '--' || threadLen) {
    const threadTxt = (thread !== '--' ? thread : '') + (threadLen ? '  x  ' + toFraction(parseFloat(threadLen),64) + '" Thread Length' : '');
    html += `<text x="${cx}" y="${bottomY+100}" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">${threadTxt}</text>`;
  }

  // arrow marker defs
  const defs = `<defs>
    <marker id="adL" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M8,1 L1,4 L8,7" fill="none" stroke="${dimColor}" stroke-width="1"/>
    </marker>
    <marker id="adR" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7" fill="none" stroke="${dimColor}" stroke-width="1"/>
    </marker>
  </defs>`;

  svg.setAttribute('viewBox', `0 0 900 ${bottomY+130}`);
  svg.innerHTML = defs + html;
}

document.getElementById('diameter').addEventListener('change', draw);
document.getElementById('dimA').addEventListener('input', draw);
document.getElementById('dimB').addEventListener('input', draw);

// Clear the default value the first time the user focuses A or B, so they can type fresh
[document.getElementById('dimA'), document.getElementById('dimB'), document.getElementById('threadLength')].forEach(function(el){
  el.addEventListener('focus', function(){
    if (this.value === this.dataset.default) {
      this.value = '';
    }
  });
  el.addEventListener('blur', function(){
    if (this.value === '') {
      this.value = this.dataset.default;
      draw();
    }
  });
});
document.getElementById('partNumber').addEventListener('input', draw);
document.getElementById('quantity').addEventListener('input', draw);
document.getElementById('threadDesig').addEventListener('change', draw);
document.getElementById('threadLength').addEventListener('input', draw);

draw();
</script>
</body>
</html>
